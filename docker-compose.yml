services:
  cursor-server:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      REPOS_ROOT: /data/repos
      BOARD_DB_PATH: /data/board.db
    volumes:
      - repos_data:/data/repos
      - board_data:/data
    restart: unless-stopped

volumes:
  repos_data:
  board_data:
